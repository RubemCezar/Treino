    }

  .muted{color:var(--muted)}

  .stack{margin-top:14px}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grow{flex:1;min-width:0}
  .ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{font:inherit;font-weight:550;border:1px solid var(--line);background:var(--surface);color:var(--ink);

  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:#0C4FB0}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--blue);padding:8px 6px}
  .btn.danger{color:var(--red)}
  .btn.wide{width:100%;text-align:center}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);

  .chip.on{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue);font-weight:550}

  .tag.mus{background:var(--chip-bg);color:var(--muted)}
  .tag.prox{background:var(--blue-soft);color:var(--blue);vertical-align:middle;font-weight:600}

  .num{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;
       font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);color:var(--ink)}
  .num:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
  .num::placeholder{color:var(--muted);font-weight:500;opacity:1}

  .ex + .ex{margin-top:10px}

  .ex.done{border-left-color:var(--green)}

  .setrow.head{color:var(--muted);font-size:12px;padding-bottom:2px}
  .setrow.head span{text-align:center}
  .setno{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;text-align:center}
  .chk{width:42px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;
       color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
  .chk.on{background:var(--green);border-color:var(--green);color:var(--surface)}
  .ex.done .num, .setrow.ok .num{background:var(--ok-bg);border-color:var(--ok-line)}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--nav-bg);border-top:1px solid var(--line);

  nav button.on{color:var(--blue);font-weight:600;border-top-color:var(--blue)}

  .stat b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
  .stat span{font-size:12px;color:var(--muted)}
  .dots{display:flex;gap:4px;margin:2px 0}

  .hist{font-size:11.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
  .dia{aspect-ratio:1;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--ink);

  .dia[disabled]{color:var(--muted);opacity:.55;cursor:default}

  .dia.vazio{visibility:hidden}

  .arrastavel{touch-action:pan-y}

  .empty{text-align:center;padding:28px 16px;color:var(--muted)}

  @media (max-width:380px){
    .setrow{grid-template-columns:24px 1fr 1fr 40px;gap:6px}

  }
  @media (prefers-reduced-motion:no-preference){.chk,.btn{transition:background .12s ease,color .12s ease}}
</style>

/* Quantos exercícios cabem no tempo informado. Conta 45s de execução por série,
   mais o descanso do objetivo, e reserva 5 min de aquecimento inicial. */
function exerciciosNoTempo(minutos, obj){
  const porSerie = obj.rest + 45;
  const cabem = Math.floor((minutos*60 - 300) / (obj.sets * porSerie));
  return Math.max(3, Math.min(8, cabem));
}

function gerarPlano(cfg){
  const obj = OBJETIVOS[cfg.objetivo] || OBJETIVOS.hipertrofia;
  const nEx = exerciciosNoTempo(cfg.tempo, obj);
  const tabela = cfg.enfase==="F" ? DIVISOES_INFERIOR
               : cfg.enfase==="E" ? DIVISOES            // equilibrada
               : DIVISOES_SUPERIOR;
  const dias = tabela[cfg.dias] || tabela[3];

  return dias.map(([nome, tipo]) => {
    let slots = SLOTS[tipo].slice();
    // ênfase inferior: glúteo e posterior ganham espaço nos dias de perna
    if(cfg.enfase==="F" && (tipo==="lower" || tipo==="full")){
      slots = ["Glúteos"].concat(slots);
    }
    // grupos priorizados entram na frente, na ordem escolhida, se couberem no dia
    const focos = (cfg.focos || []).filter(g => slots.includes(g));
    if(focos.length) slots = focos.concat(slots);

    const usados = [];
    const items = [];
    for(let i=0; i<slots.length && items.length<nEx; i++){
      const grupo = slots[i], lista = POOL[grupo] || [];
      const escolhido = lista.find(n => !usados.includes(n));
      if(!escolhido) continue;
      usados.push(escolhido);
      items.push({exId: slug(escolhido), sets: obj.sets, reps: obj.reps, rest: obj.rest});
    }
    return {nome, items};
  });
}

/* Armazenamento: usa o storage do Claude quando existe; fora dele (arquivo salvo
   no celular/PC) cai para o armazenamento do próprio navegador. */
let storageMode = "memória";
const MEMO = {};
const store = (function(){
  if (typeof window.storage === "object" && window.storage && typeof window.storage.get === "function") {
    storageMode = "claude";
    return {get:k=>window.storage.get(k), set:(k,v)=>window.storage.set(k,v)};
  }
  try {
    const t="__t"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t);
    storageMode = "navegador";
    return {
      get: async k => { const v=window.localStorage.getItem(k); if(v===null) throw new Error("vazio"); return {key:k,value:v}; },
      set: async (k,v) => { window.localStorage.setItem(k,v); return {key:k,value:v}; }
    };
  } catch(e){}
  return {
    get: async k => { if(!(k in MEMO)) throw new Error("vazio"); return {key:k,value:MEMO[k]}; },
    set: async (k,v) => { MEMO[k]=v; return {key:k,value:v}; }
  };
})();

function mirror(v){ try{ window.localStorage.setItem(KEY+":copia", v); }catch(e){} }
async function flush(){
  clearTimeout(saveT); saveT=null;
  const v = JSON.stringify(S);
  try { await store.set(KEY, v); } catch(e){ console.error("Não foi possível salvar", e); }
  if(storageMode!=="navegador") mirror(v);   // segunda cópia, quando o navegador permitir
}

/* Ajusta dados gravados por versões anteriores do app. Roda em toda abertura
   e também depois de restaurar um backup antigo. */
function migrar(){
  if(!Array.isArray(S.cardio)) S.cardio=[];
  const arrumaSets = en => {
    if(!en || !Array.isArray(en.sets)) return;
    if(en.rest===undefined) en.rest=90;
    if(en.reps===undefined) en.reps="";
    if(en.note===undefined) en.note="";
    en.sets.forEach(st => {
      if(!st.tipo){ st.tipo = st.warm ? "A" : "T"; delete st.warm; }
      if(typeof st.sug === "object" && st.sug !== null) return;   // já é o formato novo
      const tinha = st.sug === true && !st.done && (st.w!=="" || st.r!=="");
      st.sug = tinha ? {w: fmt(num(st.w)), r: String(num(st.r))} : null;
      if(tinha){ st.w=""; st.r=""; }                              // vira sugestão, não valor
    });
  };
  if(S.active && Array.isArray(S.active.entries)) S.active.entries.forEach(arrumaSets);
  S.routines = S.routines.filter(r => r.items && r.items.length ||
      !(r.name==="Nova rotina" || r.name==="Novo treino"));   // limpa treinos vazios sem nome próprio
  S.routines.forEach(r => {
    if(!Array.isArray(r.items)) r.items=[];
    r.items.forEach(it => {
      it.sets = Math.min(20, Math.max(1, parseInt(it.sets,10)||3));
      if(it.padraoTipos && typeof it.padraoTipos!=="object") delete it.padraoTipos;
      it.rest = Math.min(600, Math.max(0, parseInt(it.rest,10)||90));
      if(typeof it.reps!=="string") it.reps = String(it.reps||"");
      it.reps = it.reps.slice(0,12);
    });
  });
}

/* ---------- utilidades ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : 0; };
const fmt = n => (Math.round(n*10)/10).toString().replace(".",",");
// padrão do app: repetições × carga  (ex.: 12×42,5)
/* Tipo da série: T = válida (conta), A = aquecimento, P = preparatória/feeder.
   Só as válidas entram em volume, contagem de séries, recordes e sugestões. */
const TIPOS_SERIE = {T:{rot:"", cor:"", nome:"válida"},
                     A:{rot:"A", cor:"var(--amber)", nome:"aquecimento"},
                     P:{rot:"P", cor:"var(--blue)", nome:"preparatória"}};
const tipoSerie = st => st.tipo || (st.warm ? "A" : "T");
const valida = st => tipoSerie(st)==="T";
const proxTipo = st => ({T:"A", A:"P", P:"T"})[tipoSerie(st)];

const par = (w,r) => num(w)>0 ? num(r)+"×"+fmt(num(w)) : num(r)+" reps";
const parKg = (w,r) => num(w)>0 ? num(r)+"×"+fmt(num(w))+" kg" : num(r)+" reps";
const e1rm = (w,r) => w>0 && r>0 ? w*(1+r/30) : 0;
function ton(kg){ return kg >= 1000 ? fmt(kg/1000)+" t" : Math.round(kg)+" kg"; }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function dur(ms){ const m=Math.floor(ms/60000); return m>=60 ? Math.floor(m/60)+"h"+String(m%60).padStart(2,"0") : m+" min"; }
function dateLabel(ts){
  const d=new Date(ts), h=new Date(), y=new Date(Date.now()-864e5);
  const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,h)) return "Hoje";
  if(same(d,y)) return "Ontem";
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
}
function volume(entries){
  let v=0; entries.forEach(en => en.sets.forEach(s => { if(s.done && valida(s)) v += num(s.w)*num(s.r); })); return v;
}
function doneSets(entries){ let n=0; entries.forEach(en=>en.sets.forEach(s=>{if(s.done&&valida(s))n++})); return n; }

function historyFor(exId){
  const out=[];
  S.sessions.forEach(se => {
    const en = se.entries.find(e => e.exId===exId);
    if(!en) return;
    const sets = en.sets.filter(s=>s.done && valida(s) && (num(s.w)>0 || num(s.r)>0));
    if(!sets.length) return;
    let bw=0, be=0, br=0, vol=0, reps=0, bset=null;
    sets.forEach(s => { const w=num(s.w), r=num(s.r); vol+=w*r; reps+=r;
      if(w>bw) bw=w; if(r>br) br=r;
      const e=e1rm(w,r); if(e>be) be=e;
      if(!bset || w>bset.w || (w===bset.w && r>bset.r)) bset={w,r}; });
    out.push({t:se.end||se.start, sessionId:se.id, bw, be, br, vol, reps, bset, sets:sets.length});
  });
  return out.sort((a,b)=>a.t-b.t);
}
function bestFor(exId, exceptId){
  let w=0,e=0;
  S.sessions.forEach(se => {
    if(exceptId && se.id===exceptId) return;
    const en = se.entries.find(x=>x.exId===exId); if(!en) return;
    en.sets.forEach(s=>{ if(!s.done || !valida(s)) return; const W=num(s.w), R=num(s.r);
      if(W>w) w=W; const E=e1rm(W,R); if(E>e) e=E; });
  });
  return {w,e};
}
/* Última execução do exercício. Procura primeiro dentro do MESMO treino:
   o mesmo exercício no Push e no Upper vem em ordem e fadiga diferentes, então
   comparar entre treinos distorce. Só cai para outro treino se nunca tiver sido
   feito neste — aí a tela avisa. */
function ultimaExecucao(exId, rotId){
  const id = rotId===undefined ? (S.active ? S.active.routineId : null) : rotId;
  let fora = null;
  for(let i=S.sessions.length-1;i>=0;i--){
    const se = S.sessions[i];
    const en = se.entries.find(x=>x.exId===exId);
    if(!en || !en.sets.some(s=>s.done && valida(s))) continue;
    const sets = en.sets.filter(s=>s.done && valida(s));
    if(se.routineId === id) return {sets, mesmoTreino:true, nome:se.name};
    if(!fora) fora = {sets, mesmoTreino:false, nome:se.name};
  }
  return fora;
}
function lastSetsFor(exId, rotId){
  const u = ultimaExecucao(exId, rotId);
  return u ? u.sets : null;
}
function weekStats(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day).getTime();
  const ss=S.sessions.filter(s=>(s.end||s.start)>=mon);
  return {count:ss.length, vol:ss.reduce((a,s)=>a+volume(s.entries),0)};
}

function inicioMes(ts){ const d=new Date(ts); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
function sessoesDoMes(ts){
  const d=new Date(ts), ini=new Date(d.getFullYear(),d.getMonth(),1).getTime(),
        fim=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
  return S.sessions.filter(x => { const t=x.end||x.start; return t>=ini && t<fim; });
}
function monthStats(ts){
  const ss=sessoesDoMes(ts);
  return {count:ss.length, vol:ss.reduce((a,x)=>a+volume(x.entries),0),
          series:ss.reduce((a,x)=>a+doneSets(x.entries),0)};
}

function cardioDoDia(ts){
  const d=new Date(ts), ini=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  return S.cardio.filter(c => c.t>=ini && c.t<ini+864e5);
}
function ritmo(c){
  if(!(c.km>0) || !(c.min>0)) return "";
  const segPorKm = (c.min*60)/c.km;
  return Math.floor(segPorKm/60)+":"+String(Math.round(segPorKm%60)).padStart(2,"0")+" /km";
}
function resumoCardio(c){
  const partes=[c.min+" min"];
  if(c.km>0) partes.push(fmt(c.km)+" km");
  if(c.km>0 && c.min>0) partes.push(ritmo(c));
  if(c.intensidade) partes.push(c.intensidade.toLowerCase());
  return partes.join(" · ");
}
function semanaCardio(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day).getTime();
  const ss=S.cardio.filter(c=>c.t>=mon);
  return {count:ss.length, min:ss.reduce((a,c)=>a+(+c.min||0),0)};
}

function proximoTreino(){
  if(!S.routines.length) return null;
  for(let i=S.sessions.length-1;i>=0;i--){
    const idx=S.routines.findIndex(r=>r.id===S.sessions[i].routineId);
    if(idx>=0) return S.routines[(idx+1)%S.routines.length].id;
  }
  return S.routines[0].id;   // ainda sem histórico: começa pelo primeiro
}

function weekByMuscle(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day).getTime();
  const m={};
  S.sessions.filter(s=>(s.end||s.start)>=mon).forEach(se=>se.entries.forEach(en=>{
    const g=exById(en.exId).muscle;
    m[g]=(m[g]||0)+en.sets.filter(x=>x.done&&valida(x)).length;
  }));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function startRest(sec){ restTotal=sec; restEnd=Date.now()+sec*1000; renderFloat(); }
function beep(){
  try{
    const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C(), o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.type="sine";
    g.gain.setValueAtTime(.001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);
    o.start(); o.stop(ctx.currentTime+.55);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}
setInterval(() => {
  if(restEnd){
    const left=(restEnd-Date.now())/1000;
    if(left<=0){ restEnd=0; beep(); renderFloat(); }
    else { const el=$("#restT"); if(el) el.textContent=mmss(left); else renderFloat(); }
  }
  if(S.active){

    const precisa = !(naSessao && view==="treinar");
    if(precisa && !barra) renderFloat();

  }
}, 500);

/* Índice do próximo exercício com série pendente, a partir de `depois` e dando
   a volta na lista. null quando não sobra nada — é o único caso em que "Concluir
   treino" deve aparecer no resumo. */
function proximoPendente(depois){
  const n=S.active.entries.length;
  for(let k=1;k<=n;k++){
    const i=(depois+k)%n;
    const en=S.active.entries[i];
    if(!en.skipped && en.sets.some(x=>!x.done)) return i;
  }
  return null;
}

function metricasEx(sets){
  const val = sets.filter(s=>s.done!==false && valida(s));
  let reps=0, carga=0, indice=0, volume=0;
  val.forEach(s=>{ const w=num(s.w), r=num(s.r);
    reps+=r; volume+=w*r; if(w>carga) carga=w;
    const e=e1rm(w,r); if(e>indice) indice=e; });
  return {series:val.length, reps, carga, indice, volume};
}

function comparativoEx(exId, setsAtuais){
  const agora = metricasEx(setsAtuais);
  const u = ultimaExecucao(exId);
  return {agora, antes: u ? metricasEx(u.sets) : null,
          mesmoTreino: u ? u.mesmoTreino : true, ondeFoi: u ? u.nome : ""};
}

function melhorSerie(sets){
  let b=null;
  sets.forEach(s => { const w=num(s.w), r=num(s.r);
    if(!b || w>b.w || (w===b.w && r>b.r)) b={w,r}; });
  return b ? par(b.w,b.r) : "—";
}

function sessaoAberta(ei, en){
  const total=en.sets.length, done=en.sets.filter(s=>s.done).length;
  // pronto = fechado por padrão, menos o exercício em que se acabou de mexer
  const padrao = !(total>0 && done===total) || ei===ultimoMexido;
  return dobrado.has(ei) ? !padrao : padrao;
}

function cardExercicio(en, ei, foco, cabecalho){
  const ex=exById(en.exId);
  const prev = lastSetsFor(en.exId);
  const rec = bestFor(en.exId, null);
  let prIdx=-1, prBest=0;
  if(rec.w>0) en.sets.forEach((st,si) => { if(!st.done || !valida(st)) return;
    const W=num(st.w), R=num(st.r), E=e1rm(W,R);
    if(W>0 && (W>rec.w+0.001 || E>rec.e+0.001) && E>prBest){ prBest=E; prIdx=si; } });

  let h = `<p class="muted" style="font-size:12.5px;margin-top:2px">${esc(ex.muscle)}${
    prev ? (foco ? "" : " · última: "+prev.map(x=>par(x.w,x.r)).join(", ")) : " · primeira vez"}</p>`;

  if(foco){
    if(rec.w>0 || rec.e>0){
      h += `<div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
        <span class="tag pr">recorde ${rec.w>0?fmt(rec.w)+" kg":"índice "+Math.round(rec.e)}</span>
        <button class="chip" data-act="verProg" data-id="${en.exId}">Ver progressão</button></div>`;
    } else {
      h += `<div class="row" style="margin-top:8px"><button class="chip" data-act="verProg" data-id="${en.exId}">Ver progressão</button></div>`;
    }
    h += `<input class="field" style="margin-top:10px;font-size:14px" data-note="${ei}" data-k="n-${ei}"
      value="${esc(en.note||"")}" placeholder="Anotação: pegada, banco, número da máquina...">`;
  } else if(en.note){
    h += `<p class="muted" style="font-size:12.5px;margin-top:4px;font-style:italic">${esc(en.note)}</p>`;
  }

  const comHist = foco && !!prev;
  h += (foco || cabecalho)
    ? `<div class="setrow head ${comHist?"comhist":""}" style="margin-top:10px">
        <span>#</span><span>reps</span><span>kg</span>${comHist?"<span>última</span>":""}<span></span></div>`
    : `<div style="height:8px"></div>`;

  let nValida = 0;   // as válidas são numeradas 1,2,3... ignorando A e P
  en.sets.forEach((st,si) => {
    const ehValida = valida(st);
    if(ehValida) nValida++;
    const rotulo = ehValida ? String(nValida) : TIPOS_SERIE[tipoSerie(st)].rot;
    const p = prev ? prev[Math.min(si, prev.length-1)] : null;
    h += `<div class="setrow ${comHist?"comhist":""} ${st.done?"ok":""}">
      <button class="setno" data-act="tipoSerie" data-i="${ei}" data-j="${si}"
        title="Série ${TIPOS_SERIE[tipoSerie(st)].nome} — toque para mudar"
        aria-label="${ehValida?"Série "+nValida:TIPOS_SERIE[tipoSerie(st)].nome}. Toque para mudar o tipo"
        style="border:0;background:none;font:inherit;cursor:pointer;${ehValida?"":"color:"+TIPOS_SERIE[tipoSerie(st)].cor+";font-weight:650"}">${rotulo}</button>
      <input class="num" inputmode="numeric" data-k="${ei}-${si}-r" data-e="${ei}" data-s="${si}" data-f="r" value="${st.r!==""?esc(st.r):""}" placeholder="${st.sug?esc(st.sug.r):(en.reps?esc(en.reps):"0")}" aria-label="Repetições, ${ehValida?"série "+nValida:TIPOS_SERIE[tipoSerie(st)].nome}">
      <input class="num" inputmode="decimal" data-k="${ei}-${si}-w" data-e="${ei}" data-s="${si}" data-f="w" value="${st.w!==""?esc(st.w):""}" placeholder="${st.sug?esc(st.sug.w):"0"}" aria-label="Carga em kg, ${ehValida?"série "+nValida:TIPOS_SERIE[tipoSerie(st)].nome}${st.sug?", sugestão "+esc(st.sug.w):""}">
      ${comHist?`<span class="hist">${p?par(p.w,p.r):"—"}</span>`:""}
      <button class="chk ${st.done?"on":""}" data-act="check" data-i="${ei}" data-j="${si}" aria-pressed="${st.done?"true":"false"}" aria-label="Concluir ${ehValida?"série "+nValida:TIPOS_SERIE[tipoSerie(st)].nome} de ${esc(ex.name)}">✓</button>
    </div>${si===prIdx?`<div style="margin:-2px 0 4px 34px"><span class="tag pr">recorde pessoal</span></div>`:""}`;
  });
  return h;
}

/* três séries em branco, já com a sugestão do último treino daquele exercício */

  const prev = lastSetsFor(exId);
  return [0,1,2].map(i => {
    const p = prev ? prev[Math.min(i, prev.length-1)] : null;
    return {w:"", r:"", done:false, sug: p ? {w:fmt(num(p.w)), r:String(num(p.r))} : null};
  });
}

  const i = S.active.entries.findIndex(en => en.sets.some(s=>!s.done));

function metricasEx(sets){
  const val = sets.filter(s=>s.done!==false && valida(s));
  let reps=0, carga=0, indice=0, volume=0;
  val.forEach(s=>{ const w=num(s.w), r=num(s.r);
    reps+=r; volume+=w*r; if(w>carga) carga=w;
    const e=e1rm(w,r); if(e>indice) indice=e; });
  return {series:val.length, reps, carga, indice, volume};
}

function comparativoEx(exId, setsAtuais){
  const agora = metricasEx(setsAtuais);
  const u = ultimaExecucao(exId);
  return {agora, antes: u ? metricasEx(u.sets) : null,
          mesmoTreino: u ? u.mesmoTreino : true, ondeFoi: u ? u.nome : ""};
}

function melhorSerie(sets){
  let b=null;
  sets.forEach(s => { const w=num(s.w), r=num(s.r);
    if(!b || w>b.w || (w===b.w && r>b.r)) b={w,r}; });
  return b ? par(b.w,b.r) : "—";
}

function sessaoAberta(ei, en){
  const total=en.sets.length, done=en.sets.filter(s=>s.done).length;
  // pronto = fechado por padrão, menos o exercício em que se acabou de mexer
  const padrao = !(total>0 && done===total) || ei===ultimoMexido;
  return dobrado.has(ei) ? !padrao : padrao;
}

function importFromText(txt){
  try{
    const j=JSON.parse(txt);
    const d=(j && j.data) ? j.data : j;
    if(!d || !Array.isArray(d.sessions) || !Array.isArray(d.routines)) throw new Error("formato");
    S=Object.assign({custom:[],routines:[],sessions:[],cardio:[],active:null,meta:{lastBackup:0,lastBackupCount:0}}, d);
    migrar(); flush(); sheetText=null; render();
    toast("Backup restaurado: "+S.sessions.length+" treinos.");
    return true;
  }catch(e){ toast("Não reconheci esse conteúdo como um backup do app."); return false; }
}

function aplicarTema(){

  const raiz=document.documentElement;
  if(t==="auto") raiz.removeAttribute("data-tema"); else raiz.setAttribute("data-tema",t);
  const escuro = t==="escuro" ||
    (t==="auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.content = escuro ? "#101318" : "#F4F6F7";

  const dias=new Date(ano,mes+1,0).getDate();

  const porDia={}, cardioPorDia={};
  sessoesDoMes(base.getTime()).forEach(se => {
    const d=new Date(se.end||se.start).getDate(); (porDia[d]=porDia[d]||[]).push(se);

  S.cardio.forEach(c => {

  });
  const minCardio = Object.values(cardioPorDia).flat().reduce((a,c)=>a+(+c.min||0),0);
  const st=monthStats(base.getTime());
  const nome=base.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

  let h = `<div class="between stack">
      <button class="btn sm" data-act="mes" data-d="-1" aria-label="Mês anterior">◀</button>

          const d=i+1, tem=!!porDia[d], card=!!cardioPorDia[d];

          return `<button class="dia ${tem?"treino":""} ${card?"cardio":""} ${calDia===d?"sel":""} ${eHoje?"hoje":""}"
            data-act="dia" data-d="${d}" ${(tem||card)?"":"disabled"}

  const doDia = calDia ? (porDia[calDia]||[]) : [];

  if(calDia){
    h += `<h2 class="stack">${calDia} de ${base.toLocaleDateString("pt-BR",{month:"long"})}</h2>`;
    if(!doDia.length && !cardioDia.length){

  } else {

  return h;
}

function vProgresso(){
  const ids=[...new Set(S.sessions.flatMap(s=>s.entries.map(e=>e.exId)))]
    .filter(id=>historyFor(id).length).sort((a,b)=>exById(a).name.localeCompare(exById(b).name));
  if(!ids.length) return `<div class="empty">Sem dados ainda.<br>Registre alguns treinos para ver a evolução de carga.</div>`;
  if(!progressEx || !ids.includes(progressEx)) progressEx = ids[0];
  const hist = historyFor(progressEx);
  const comCarga = hist.some(p=>p.bw>0);
  const val = p => comCarga ? p.be : p.br;
  const bw = Math.max(...hist.map(p=>p.bw));
  const be = Math.max(...hist.map(p=>p.be));
  const brm = Math.max(...hist.map(p=>p.br));
  const vol = hist.reduce((a,p)=>a+p.vol,0);
  const repsTot = hist.reduce((a,p)=>a+p.reps,0);
  const first = hist[0], lastP = hist[hist.length-1];
  const delta = hist.length>1 ? val(lastP) - val(first) : 0;

  let h = `<div class="card stack"><label class="muted" style="font-size:12.5px">Exercício</label>
      <select class="field" style="margin-top:6px" data-act="selEx">
        ${ids.map(id=>`<option value="${id}" ${id===progressEx?"selected":""}>${esc(exById(id).name)}</option>`).join("")}
      </select></div>
    <div class="stats stack">
      ${comCarga
        ? `<div class="stat"><b>${fmt(bw)} kg</b><span>maior carga</span></div>
           <div class="stat"><b>${Math.round(be)}</b><span>índice de força</span></div>`
        : `<div class="stat"><b>${brm}</b><span>maior série (reps)</span></div>
           <div class="stat"><b>${repsTot}</b><span>reps no total</span></div>`}
      <div class="stat"><b>${hist.length}</b><span>sessões</span></div>
    </div>
    <div class="card stack">
      <div class="between"><h3>${comCarga?"Índice de força por sessão":"Melhor série por sessão"}</h3>
        <span class="muted tnum" style="font-size:13px">${delta>=0?"+":""}${comCarga?Math.round(delta):fmt(delta)+" reps"}</span></div>
      ${chart(hist, val)}
      <p class="muted" style="font-size:12px;margin-top:6px">${comCarga
        ? "O índice combina carga e repetições numa escala só (carga × (1 + reps ÷ 30)), para comparar sessões diferentes. Sobe quando você melhora por qualquer via. Perde precisão acima de ~12 reps."
        : "Exercício sem carga externa: a curva acompanha a melhor série em repetições."}</p>
    </div>
    <h2 class="stack">Sessão a sessão</h2>`;
  hist.slice().reverse().forEach(p => {
    h += `<div class="card stack" style="padding:11px 14px"><div class="between">
      <span>${dateLabel(p.t)}</span>
      <span class="tnum muted" style="font-size:14px">melhor série ${parKg(p.bset.w,p.bset.r)}${p.vol>0?" · "+ton(p.vol):""}</span></div></div>`;
  });
  h += `<div class="stack"><p class="muted" style="font-size:12.5px">${comCarga?"Volume total acumulado neste exercício: "+ton(vol)+".":"Total de repetições acumuladas: "+repsTot+"."}</p></div>`;
  return h;
}

function chart(hist, val){
  val = val || (p => p.be);
  const W=320,H=130,P=26;
  const pts=hist.slice(-14);
  if(pts.length<2) return `<p class="muted" style="padding:16px 0">Precisa de pelo menos duas sessões para desenhar a curva.</p>`;
  const vs=pts.map(val);
  let mn=Math.min(...vs), mx=Math.max(...vs);
  if(mx-mn<1){ mx=mn+1; }
  const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const x=i=>P+(i*(W-P-8))/(pts.length-1);
  const y=v=>H-20-((v-mn)/(mx-mn))*(H-20-10);
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(val(p)).toFixed(1)}`).join(" ");
  const area=`${P},${H-20} ${line} ${x(pts.length-1).toFixed(1)},${H-20}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="150" role="img" aria-label="Evolução do índice de força" style="margin-top:8px">
    <line x1="${P}" y1="${H-20}" x2="${W-8}" y2="${H-20}" stroke="var(--line)"/>
    <polygon points="${area}" fill="var(--blue-soft)"/>
    <polyline points="${line}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(val(p)).toFixed(1)}" r="2.8" fill="var(--surface)" stroke="var(--blue)" stroke-width="2"/>`).join("")}
    <text x="2" y="14" font-size="10" fill="var(--muted)">${fmt(mx)}</text>
    <text x="2" y="${H-24}" font-size="10" fill="var(--muted)">${fmt(mn)}</text>
    <text x="${P}" y="${H-6}" font-size="10" fill="var(--muted)">${dateLabel(pts[0].t)}</text>
    <text x="${W-8}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${dateLabel(pts[pts.length-1].t)}</text>
  </svg>`;
}

function recentesIds(limite){
  const vistos=[];
  for(let i=S.sessions.length-1;i>=0 && vistos.length<limite;i--){
    S.sessions[i].entries.forEach(en=>{ if(!vistos.includes(en.exId) && vistos.length<limite) vistos.push(en.exId); });
  }
  return vistos;
}

/* O cabeçalho é fixo, então alinhar o topo do elemento com o topo da janela
   esconde o nome atrás dele. Aqui descontamos a altura real do cabeçalho. */
function rolarAte(el){
  if(!el) return;
  const topo=document.querySelector(".top");
  const altura=(topo?topo.offsetHeight:0) + (document.getElementById("offbar")?document.getElementById("offbar").offsetHeight:0);
  const y=el.getBoundingClientRect().top + window.scrollY - altura - 12;
  try{ window.scrollTo({top:Math.max(0,y), behavior:"smooth"}); }
  catch(e){ window.scrollTo(0, Math.max(0,y)); }
}

function renderOffline(){
  const id="offbar"; const old=document.getElementById(id); if(old) old.remove();
  if(navigator.onLine!==false){ document.body.style.paddingTop=""; document.documentElement.style.setProperty("--offtop","0px"); return; }
  const d=document.createElement("div"); d.id=id;
  d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:12;background:var(--bar-bg);color:var(--bar-fg);font-size:12.5px;text-align:center;padding:5px 10px";
  d.textContent="Sem internet — o app segue funcionando normalmente.";
  document.body.appendChild(d);
  const alt = (d.offsetHeight || 26) + "px";
  document.body.style.paddingTop = alt;
  document.documentElement.style.setProperty("--offtop", alt);
}
window.addEventListener("online", renderOffline);
window.addEventListener("offline", renderOffline);

/* ---------- ações ---------- */
function newSession(routine){
  const entries = (routine ? routine.items : []).map(it => {
    const prev = lastSetsFor(it.exId);
    const sets=[];
    // sequência de tipos aprendida da última vez: A's primeiro, depois P's, depois T's
    const pad = it.padraoTipos;
    const seqTipos = pad ? Array(pad.A||0).fill("A").concat(Array(pad.P||0).fill("P")) : [];
    const nValidasAlvo = pad ? (pad.T || Math.min(20, Math.max(1, parseInt(it.sets,10)||3)))
                              : Math.min(20, Math.max(1, parseInt(it.sets,10)||3));
    const nSeries = seqTipos.length + nValidasAlvo;
    let iValida = 0;
    for(let i=0;i<nSeries;i++){
      const tipo = i < seqTipos.length ? seqTipos[i] : "T";
      const st = {w:"", r:"", done:false, sug:null};
      if(tipo!=="T") st.tipo = tipo;
      if(tipo==="T"){
        const p = prev ? prev[Math.min(iValida, prev.length-1)] : null;
        if(p) st.sug = {w:fmt(num(p.w)), r:String(num(p.r))};
        iValida++;
      }
      sets.push(st);
    }
    return {exId:it.exId, rest:it.rest===0?0:(it.rest||90), reps:it.reps||"", note:"", sets};
  });
  S.active = {routineId: routine?routine.id:null, name: routine?routine.name:"Treino livre", start:Date.now(), entries};
  view="treinar"; naSessao=true; focoIdx=0; wake(true); save(); render();
}

/* Depois de concluir, ensina à rotina quantas séries de cada tipo essa pessoa
   costuma fazer nesse exercício — para a PRÓXIMA sessão já oferecer as mesmas
   caixas de aquecimento/preparatória, sem forçar a marcar de novo toda vez. */
function aprenderTiposSeries(a){
  if(!a.routineId) return;
  const r = S.routines.find(x=>x.id===a.routineId);
  if(!r) return;
  a.entries.forEach(en => {
    const it = r.items.find(x=>x.exId===en.exId);
    if(!it) return;
    const conta = {A:0, P:0, T:0};
    en.sets.forEach(st => { if(st.done) conta[tipoSerie(st)]++; });
    if(conta.A || conta.P || conta.T) it.padraoTipos = conta;
  });
}

function finish(){
  const a=S.active; if(!a) return;
  aprenderTiposSeries(a);
  const algumaSerieFeita = a.entries.some(en => en.sets.some(s=>s.done));
  if(!algumaSerieFeita){ toast("Marque ao menos uma série antes de concluir."); return; }
  const entries=a.entries.map(en=>({exId:en.exId, note:en.note||"", sets:en.sets.filter(s=>s.done&&valida(s)).map(s=>({w:num(s.w),r:num(s.r),done:true}))}))
                         .filter(en=>en.sets.length);
  const prs=[];
  entries.forEach(en=>{
    const before=bestFor(en.exId,null);
    let bw=0,be=0;
    en.sets.forEach(s=>{ if(s.w>bw)bw=s.w; const e=e1rm(s.w,s.r); if(e>be)be=e; });
    if(bw>before.w+0.001) prs.push(exById(en.exId).name+" "+fmt(bw)+" kg");
    else if(be>before.e+0.001) prs.push(exById(en.exId).name+" (índice)");
  });
  S.sessions.push({id:uid(), routineId:a.routineId, name:a.name, start:a.start, end:Date.now(), entries});
  S.active=null; restEnd=0; exMenu=null; progSheet=null; picker=null; resumoEx=null; dobrado.clear(); ultimoMexido=null; naSessao=false; focoIdx=0; view="historico"; wake(false); save(); render();
  toast(prs.length ? "Treino salvo · "+prs.length+" recorde"+(prs.length>1?"s":"")+": "+prs.slice(0,2).join(", ") : "Treino salvo.");
}

function splitsAtuais(){
  return Object.entries(templatesParaSexo(enfaseModelo)).flatMap(([grupo,dias]) =>
    dias.map(([nome,exs],i) => ({k:grupo+":"+i, nome, exs:exs.length, lista:exs})));
}

function applyTemplate(k){
  templatesParaSexo(enfaseModelo)[k].forEach(([name,exs]) => {
    S.routines.push({id:uid(), name, items: exs.map(n => ({exId:slug(n), sets:3, reps:"8-12", rest:90}))});
  });
  view="treinar"; save(); render(); toast("Modelo adicionado. Ajuste os exercícios como quiser.");
}

/* Sai do editor guardando o que foi feito. Um treino recém-criado, sem
   exercícios e ainda com o nome padrão, é descartado em vez de virar entulho. */
function lerFormCardio(){
  if(!formCardio) return;
  const g=id=>document.getElementById(id);
  if(g("cMin")) formCardio.min=g("cMin").value;
  if(g("cKm")) formCardio.km=g("cKm").value;
  if(g("cNota")) formCardio.nota=g("cNota").value;
  if(g("cData") && g("cData").value){
    const [a,m,d]=g("cData").value.split("-").map(Number);
    const antiga=new Date(formCardio.t||Date.now());
    formCardio.t=new Date(a, m-1, d, antiga.getHours(), antiga.getMinutes()).getTime();
  }
}

function sairDoEditor(){
  syncRoutineName();
  const r = S.routines.find(x=>x.id===editingId);
  const vazio = r && !r.items.length && (r.name==="Novo treino" || r.name==="Nova rotina" || !r.name.trim());
  if(vazio) S.routines = S.routines.filter(x=>x.id!==r.id);
  editingId=null; view="treinar"; save(); render();
  if(vazio) toast("Treino vazio descartado.");
  return !vazio;
}

function syncRoutineName(){
  const el=$("#rname"); if(el && editingId){ const r=S.routines.find(x=>x.id===editingId); if(r) r.name=el.value.trim()||r.name; }
}

  if(!S.active && ["check","addSet","delSet","tipoSerie","setRest","rmEx","moverEx","swapEx",
                   "foco","irPara","dobrar","exMenu","pickWorkout","cancelWorkout","finish","pularEx"].includes(a)){
    render(); return;
  }
  switch(a){
    case "nav": if(view==="edit") syncRoutineName(); if(t.dataset.v!=="historico") histLimite=15; view=t.dataset.v;
      S.meta=Object.assign({},S.meta||{},{aba:view}); save(); render(); break;
    case "dlgSim": { const fn=dialogo && dialogo.fn; dialogo=null; renderFloat(); if(fn) fn(); break; }
    case "dlgNao": if(ev.target.closest("[data-stop]") && !t.classList.contains("btn")) break;
      dialogo=null; renderFloat(); break;
    case "fecharResumo": if(ev.target.closest("[data-stop]") && !t.classList.contains("btn")) break;
      resumoEx=null; renderFloat(); break;
    case "proxExercicio": {
      const de = resumoEx===null?focoIdx:resumoEx;
      const alvo = proximoPendente(de) ?? Math.min(S.active.entries.length-1, de+1);
      resumoEx=null; focoIdx=alvo; dobrado.delete(alvo); render();
      if(modo()!=="foco"){ const el=document.querySelectorAll(".ex")[alvo];
        rolarAte(el); }
      else window.scrollTo(0,0);
      break; }
    case "semResumo": S.meta=Object.assign({},S.meta||{},{semResumo:t.dataset.v==="1"}); save(); render(); break;
    case "novoCardio": { const ultimo=S.cardio.slice().sort((a,b)=>b.t-a.t)[0];
      formCardio={tipo: ultimo?ultimo.tipo:"Esteira", min:"", km:"", intensidade:"", nota:"", t:Date.now()};
      cardioBusca=""; cardioTodas=false; renderFloat(); break; }
    case "editCardio": { const c=S.cardio.find(x=>x.id===id); if(!c) break;
      formCardio=Object.assign({}, c); cardioBusca=""; cardioTodas=false; renderFloat(); break; }
    case "fecharCardio": if(ev.target.closest("[data-stop]") && !t.classList.contains("btn")) break;
      formCardio=null; renderFloat(); break;
    case "cardioTipo": lerFormCardio(); formCardio.tipo=t.dataset.v; cardioBusca=""; renderFloat(); break;
    case "enfaseModeloEsc": enfaseModelo = t.dataset.v; render(); break;
    case "abrirAssistente": assistente = {enfase:"E", dias:4, tempo:60,
      objetivo:"hipertrofia", focos:[]}; renderFloat(); break;
    case "fecharAssistente": if(ev.target.closest("[data-stop]") && !t.classList.contains("btn")) break;
      assistente=null; renderFloat(); break;
    case "asEnfase": assistente.enfase=t.dataset.v; renderFloat(); break;
    case "asDias": assistente.dias=+t.dataset.v; renderFloat(); break;
    case "asTempo": assistente.tempo=+t.dataset.v; renderFloat(); break;
    case "asObjetivo": assistente.objetivo=t.dataset.v; renderFloat(); break;
    case "asFoco": { const g=t.dataset.v; const l=assistente.focos||[];
      assistente.focos = l.includes(g) ? l.filter(x=>x!==g) : l.concat([g]);
      renderFloat(); break; }
    case "asFocoLimpar": assistente.focos=[]; renderFloat(); break;
    case "criarPlano": {

      plano.forEach(d => S.routines.push({id:uid(), name:d.nome, items:d.items}));

      toast(plano.length+" treinos criados. Ajuste como quiser."); break; }
    case "cardioTodas": lerFormCardio(); cardioTodas=true; renderFloat(); break;
    case "cardioMenos": lerFormCardio(); cardioTodas=false; renderFloat(); break;
    case "cardioInt": lerFormCardio(); formCardio.intensidade = formCardio.intensidade===t.dataset.v ? "" : t.dataset.v;
      renderFloat(); break;
    case "salvarCardio": {
      lerFormCardio();
      const bruto=parseInt(formCardio.min,10);
      if(!(bruto>0)){ toast("Informe a duração em minutos."); break; }

                 km: Math.max(0, num(formCardio.km)), intensidade: formCardio.intensidade||"",
                 nota: (formCardio.nota||"").slice(0,120), t: formCardio.t};
      const i=S.cardio.findIndex(x=>x.id===reg.id);
      if(i>=0) S.cardio[i]=reg; else S.cardio.push(reg);
      formCardio=null; save(); render(); toast(i>=0?"Cardio atualizado.":"Cardio registrado."); break; }
    case "apagarCardio": { const id0=formCardio && formCardio.id; if(!id0) break;

        () => { S.cardio=S.cardio.filter(x=>x.id!==id0); save(); render(); toast("Cardio apagado."); });

    case "usarModeloDia": { const sp=splitsAtuais().find(x=>x.k===t.dataset.sp); if(!sp) break;
      const rt=S.routines.find(x=>x.id===editingId); if(!rt) break;
      const nomeAtual = rt.name==="Novo treino" ? sp.nome : rt.name;
      rt.name = nomeAtual;
      rt.items = sp.lista.map(n => ({exId:slug(n), sets:3, reps:"8-12", rest:90}));

      ex.muscle=t.dataset.m; save(); renderFloat(); break; }
    case "salvarEx": { const ex=S.custom.find(x=>x.id===exEdit); if(!ex) break;
      const campo=document.getElementById("exNome");
      if(campo && campo.value.trim()) ex.name=campo.value.trim();
      exEdit=null; save(); render(); toast("Exercício atualizado."); break; }
    case "apagarEx": { const ex=S.custom.find(x=>x.id===exEdit); if(!ex) break;
      if(usoDoExercicio(ex.id).treinos) break;
      pedirConfirmacao("Apagar exercício?",
        `“${ex.name}” sai da sua lista e dos treinos salvos em que aparece.`,
        "Apagar",
        () => { S.custom=S.custom.filter(x=>x.id!==ex.id);
                S.routines.forEach(r=>{ r.items=r.items.filter(it=>it.exId!==ex.id); });
                exEdit=null; save(); render(); toast("Exercício apagado."); });
      exEdit=null; renderFloat(); break; }
    case "maisHist": histLimite += 25; render(); break;
    case "moverRotina": { const d=+t.dataset.d, i0=S.routines.findIndex(x=>x.id===id), alvo=i0+d;
      if(i0<0 || alvo<0 || alvo>=S.routines.length) break;
      const [mv]=S.routines.splice(i0,1); S.routines.splice(alvo,0,mv);
      save(); render(); break; }

      const abrindo = rotinaAberta!==id;
      rotinaAberta = abrindo ? id : null; render();
      if(abrindo){ const el=document.querySelector(`[data-act="abrirRotina"][data-id="${id}"]`);

      break; }

    case "voltarConfig": view = voltarPara || "treinar"; calDia=null; render(); break;
    case "tpl": applyTemplate(t.dataset.k); break;
    case "newRoutine": { const r={id:uid(),name:"Novo treino",items:[]}; S.routines.push(r); editingId=r.id; view="edit"; save(); render(); break; }
    case "editRoutine": editingId=id; view="edit"; render(); break;
    case "saveRoutine": if(sairDoEditor()) toast("Treino atualizado."); break;
    case "voltarEdit": sairDoEditor(); break;
    case "voltarTreino": naSessao=false; render(); break;
    case "delRoutine": { const r=S.routines.find(x=>x.id===id); if(!r) break;
      pedirConfirmacao("Apagar este treino salvo?",
        `“${r.name}” sai dos seus treinos. Os que você já fez continuam no histórico.`,
        "Apagar",
        () => { S.routines=S.routines.filter(x=>x.id!==id); save(); render(); toast("Treino apagado da lista."); });
      break; }
    case "rmItem": { const r=S.routines.find(x=>x.id===editingId); syncRoutineName(); r.items.splice(i,1); save(); render(); break; }
    case "moveEx": { const r=S.routines.find(x=>x.id===editingId); syncRoutineName(); const d=+t.dataset.d;
      const [it]=r.items.splice(i,1); r.items.splice(i+d,0,it); save(); render(); break; }
    case "pickRoutine": if(!S.routines.find(x=>x.id===editingId)) break;
      syncRoutineName(); picker={mode:"routine",q:"",muscle:null}; renderFloat(); break;
    case "pickWorkout": picker={mode:"workout",q:"",muscle:null}; renderFloat(); break;
    case "closePicker": if(ev.target.closest("[data-stop]") && !t.classList.contains("btn")) break; picker=null; renderFloat(); break;
    case "mus": picker.muscle=t.dataset.m||null; renderFloat(); break;
    case "choose":
      if((picker.mode==="workout"||picker.mode==="swap") && !S.active){
        picker=null; render(); toast("O treino foi encerrado."); break;
      }
      if(picker.mode==="routine" && !S.routines.find(x=>x.id===editingId)){
        picker=null; render(); toast("O treino que você editava não existe mais."); break;
      }
      if(picker.mode==="swap"){ S.active.entries[picker.i].exId=id; }
      else if(picker.mode==="routine"){ const r=S.routines.find(x=>x.id===editingId); r.items.push({exId:id,sets:3,reps:"8-12",rest:90}); }
      else { S.active.entries.push({exId:id, rest:90, reps:"", note:"", sets:novasSeries(id)}); focoIdx=S.active.entries.length-1; }
      picker=null; save(); render(); break;
    case "newEx": { const nome=(picker.q||"").trim(); if(!nome) break;
      picker.novo = nome.charAt(0).toUpperCase()+nome.slice(1); renderFloat(); break; }
    case "cancelNovo": picker.novo=null; renderFloat(); break;
    case "novoGrupo": {
      if((picker.mode==="workout"||picker.mode==="swap") && !S.active){
        picker=null; render(); toast("O treino foi encerrado."); break;
      }
      if(picker.mode==="routine" && !S.routines.find(x=>x.id===editingId)){
        picker=null; render(); toast("O treino que você editava não existe mais."); break;
      }
      const ex={id:"c_"+slug(picker.novo)+"_"+uid(), name:picker.novo, muscle:t.dataset.m};
      S.custom.push(ex);
      if(picker.mode==="swap"){ S.active.entries[picker.i].exId=ex.id; }
      else if(picker.mode==="routine"){ const r=S.routines.find(x=>x.id===editingId); r.items.push({exId:ex.id,sets:3,reps:"8-12",rest:90}); }
      else { S.active.entries.push({exId:ex.id, rest:90, reps:"", note:"", sets:novasSeries(ex.id)}); focoIdx=S.active.entries.length-1; }
      picker=null; save(); render(); toast("Exercício criado em "+t.dataset.m+"."); break; }
    case "start": { const r=S.routines.find(x=>x.id===id); if(S.active){ toast("Conclua ou descarte o treino atual."); view="treinar"; render(); break;} newSession(r); break; }
    case "repeat": { const s=S.sessions.find(x=>x.id===id);
      if(S.active){ toast("Conclua ou descarte o treino atual."); view="treinar"; render(); break; }
      newSession({id:s.routineId,name:s.name,items:s.entries.map(en=>({exId:en.exId,sets:en.sets.length,reps:"",rest:90}))}); break; }
    case "pularEx": { const en=S.active.entries[i]; en.skipped=!en.skipped;
      let alvo=focoIdx;
      if(en.skipped && modo()==="foco" && i===focoIdx){ const p=proximoPendente(i); if(p!==null) alvo=p; }
      exMenu=null; focoIdx=alvo; save(); render(); break; }
    case "check": { const st=S.active.entries[i].sets[j];
      if(!st.done && st.sug){                       // campo em branco assume a sugestão
        if(st.w==="") st.w=st.sug.w;
        if(st.r==="") st.r=st.sug.r;
      }
      if(!st.done && (num(st.w)===0 && num(st.r)===0)){ toast("Preencha carga e repetições."); break; }
      st.done=!st.done; ultimoMexido=i; dobrado.delete(i);
      const en=S.active.entries[i];
      if(st.done) en.skipped=false;
      if(st.done && mostrarResumo() && en.sets.every(x=>x.done)) resumoEx=i;
      if(st.done && (S.active.entries[i].rest||0)>0) startRest(S.active.entries[i].rest);
      save(); render(); break; }
    case "addSet": { const en=S.active.entries[i];
      if(en.sets.length>=20){ toast("Máximo de 20 séries por exercício."); break; }
      const l=en.sets[en.sets.length-1];
      const base = l ? (l.w!=="" || l.r!=="" ? {w:String(l.w),r:String(l.r)} : l.sug) : null;
      en.sets.push({w:"",r:"",done:false,sug: base && (base.w||base.r) ? base : null}); save(); render(); break; }
    case "delSet": { const en=S.active.entries[i]; if(en.sets.length>1) en.sets.pop(); save(); render(); break; }
    case "rmEx": S.active.entries.splice(i,1); exMenu=null; dobrado.clear(); ultimoMexido=null; focoIdx=Math.min(focoIdx, Math.max(0,S.active.entries.length-1)); save(); render(); break;
    case "foco": { const d=+t.dataset.d;
      focoIdx=Math.min(S.active.entries.length-1, Math.max(0, focoIdx+d)); render(); window.scrollTo(0,0); break; }
    case "irPara": focoIdx=i; render(); window.scrollTo(0,0); break;
    case "modoLista": S.meta=Object.assign({},S.meta||{},{modo:"lista"}); save(); render(); break;
    case "modoFoco": S.meta=Object.assign({},S.meta||{},{modo:"foco"}); focoIdx=primeiroIncompleto(); save(); render(); break;
    case "verProg": progSheet=id; renderFloat(); break;
    case "fecharProg": if(ev.target.closest("[data-stop]") && !t.classList.contains("btn")) break; progSheet=null; renderFloat(); break;
    case "exMenu": if(!S.active) break; exMenu=i; renderFloat(); break;
    case "moverEx": { const d=+t.dataset.d, alvo=i+d, es=S.active.entries;
      if(alvo<0 || alvo>=es.length) break;
      const [mv]=es.splice(i,1); es.splice(alvo,0,mv);
      exMenu=alvo; if(focoIdx===i) focoIdx=alvo; dobrado.clear(); ultimoMexido=null; save(); render(); break; }
    case "fecharMenu": if(ev.target.closest("[data-stop]") && !t.classList.contains("btn")) break; exMenu=null; render(); break;
    case "dobrar": if(ultimoMexido!==null && ultimoMexido!==i) ultimoMexido=null;
      if(dobrado.has(i)) dobrado.delete(i); else dobrado.add(i); render(); break;
    case "setRest": S.active.entries[i].rest=+t.dataset.d; save(); render(); break;
    case "swapEx": exMenu=null; picker={mode:"swap", i:i, q:"", muscle:null}; renderFloat(); break;
    case "tipoSerie": { const st=S.active.entries[i].sets[j];
      st.tipo=proxTipo(st); delete st.warm; save(); render(); break; }
    case "finish": finish(); break;
    case "cancelWorkout": {
      const feitas=doneSets(S.active.entries);
      pedirConfirmacao("Descartar o treino?",
        feitas ? `As ${feitas} séries marcadas serão perdidas e nada vai para o histórico.`
               : "O treino em andamento será encerrado sem registrar nada.",
        "Descartar",
        () => { S.active=null; restEnd=0; naSessao=false; focoIdx=0; picker=null; exMenu=null; progSheet=null;
                 dobrado.clear(); ultimoMexido=null; wake(false); save(); render(); toast("Treino descartado."); });
      break; }
    case "openSession": openId = openId===id ? null : id; render(); break;
    case "delSession": { const se=S.sessions.find(x=>x.id===id); if(!se) break;
      pedirConfirmacao("Apagar este registro?",
        `O treino “${se.name}” de ${dateLabel(se.end||se.start)} sai do histórico, do calendário e das estatísticas. Não dá para desfazer.`,
        "Apagar",
        () => { S.sessions=S.sessions.filter(x=>x.id!==id); openId=null; save(); render(); toast("Treino apagado."); });
      break; }
    case "export": {
      const blob=new Blob([backupText()],{type:"application/json"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download="treino-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      marcarBackup(); toast("Backup baixado."); break; }
    case "copyBackup": {
      const txt=backupText();
      const okCopy = () => { marcarBackup(); render(); toast("Backup copiado. Cole num lugar seguro (Notion, e-mail, notas)."); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(okCopy).catch(()=>{ sheetText={mode:"copy",text:txt}; renderFloat(); });
      } else { sheetText={mode:"copy",text:txt}; renderFloat(); }
      break; }
    case "copiedOk": marcarBackup(); sheetText=null; render(); toast("Backup registrado. Guarde esse texto em lugar seguro."); break;
    case "retomar": naSessao=true; view="treinar"; focoIdx=primeiroIncompleto(); render(); break;
    case "tema": { S.meta=Object.assign({lastBackup:0,lastBackupCount:0}, S.meta||{}, {tema:t.dataset.t});
      aplicarTema(); save(); render(); break; }
    case "pasteOpen": sheetText={mode:"paste",text:""}; renderFloat(); break;
    case "pasteApply": { const ta=document.getElementById("bkTa"); if(ta) importFromText(ta.value.trim()); break; }
    case "closeSheet": if(ev.target.closest("[data-stop]") && !t.classList.contains("btn")) break; sheetText=null; renderFloat(); break;
    case "importPick": { const f=document.getElementById("impf"); if(f) f.click(); break; }
    case "rest15": restEnd+=15000; renderFloat(); break;
    case "restSkip": restEnd=0; renderFloat(); break;
  }
});

document.addEventListener("input", ev => {
  const el=ev.target;
  if(el.id==="pq"){ picker.q=el.value; renderFloat(); const q=$("#pq"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} return; }
  if(el.id==="cBusca"){ lerFormCardio(); cardioBusca=el.value; renderFloat();
    const b=$("#cBusca"); if(b){ b.focus(); b.setSelectionRange(b.value.length,b.value.length); } return; }
  if(el.dataset.f && el.dataset.e!==undefined && el.dataset.s!==undefined && S.active){
    if(+el.dataset.e !== ultimoMexido) ultimoMexido = +el.dataset.e;
    const st=S.active.entries[+el.dataset.e].sets[+el.dataset.s];
    st[el.dataset.f]=el.value; save(); return;
  }
  if(el.dataset.note!==undefined && S.active){
    S.active.entries[+el.dataset.note].note = el.value; save(); return;
  }
  if(el.dataset.item!==undefined && editingId){
    const r=S.routines.find(x=>x.id===editingId); const it=r.items[+el.dataset.item]; const f=el.dataset.f;
    if(f==="reps"){ it.reps = el.value.slice(0,12); }
    else if(f==="sets"){ it.sets = Math.min(20, Math.max(1, parseInt(el.value||"0",10)||1)); }
    else { it.rest = Math.min(600, Math.max(0, parseInt(el.value||"0",10)||0)); }
    save(); return;
  }
  if(el.id==="rname"){ syncRoutineName(); save(); }
});

document.addEventListener("change", ev => {
  if(ev.target.dataset.act==="selEx"){ progressEx=ev.target.value; render(); return; }
  if(ev.target.id==="impf" && ev.target.files && ev.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>importFromText(String(fr.result));
    fr.onerror=()=>toast("Não foi possível ler o arquivo.");
    fr.readAsText(ev.target.files[0]);
  }
});

document.addEventListener("keydown", ev => {
  if((ev.key==="Enter"||ev.key===" ") && ev.target.getAttribute && ev.target.getAttribute("role")==="button"){
    ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); return;
  }
  if(ev.key==="Escape" && (picker||sheetText||exMenu!==null||progSheet||dialogo||exEdit||resumoEx!==null||formCardio||assistente)){ picker=null; sheetText=null; exMenu=null; progSheet=null; dialogo=null; exEdit=null; resumoEx=null; formCardio=null; assistente=null; renderFloat(); }
  if(S.active && naSessao && modo()==="foco" && !picker && !exMenu && !progSheet && document.activeElement && document.activeElement.tagName!=="INPUT"){
    if(ev.key==="ArrowLeft" && focoIdx>0){ focoIdx--; render(); }
    if(ev.key==="ArrowRight" && focoIdx<S.active.entries.length-1){ focoIdx++; render(); }
  }
});

let toqueX=null, toqueY=null;
document.addEventListener("touchstart", ev => {
  if(!(S.active && naSessao && modo()==="foco") || picker || exMenu!==null || progSheet) { toqueX=null; return; }
  const t0=ev.changedTouches[0]; toqueX=t0.clientX; toqueY=t0.clientY;
}, {passive:true});
document.addEventListener("touchend", ev => {
  if(toqueX===null || !S.active) return;
  const t0=ev.changedTouches[0], dx=t0.clientX-toqueX, dy=t0.clientY-toqueY;
  toqueX=null;
  if(Math.abs(dx)<70 || Math.abs(dy)>50) return;             // só gesto claramente horizontal
  if(ev.target.closest && ev.target.closest("input,textarea,select")) return;
  const novo = focoIdx + (dx<0 ? 1 : -1);
  if(novo<0 || novo>=S.active.entries.length) return;
  focoIdx=novo; render(); window.scrollTo(0,0);
}, {passive:true});

/* Reordenar exercícios do treino arrastando.
   Pressão longa evita conflito com a rolagem da página. */
let arraste = null, esperaPressao = null, pontoInicial = null, acabouArraste = false;

// pura, para poder ser testada: em que posição o card cai
function destinoArraste(centros, idx, centroArrastado){
  let destino = idx;
  for(let j=0;j<centros.length;j++){
    if(j===idx) continue;
    if(j<idx && centroArrastado <= centros[j]){ destino = Math.min(destino, j); }
    if(j>idx && centroArrastado >= centros[j]){ destino = Math.max(destino, j); }
  }
  return destino;
}

function cardsArrastaveis(lista){ return [...document.querySelectorAll(`[data-arrastar][data-lista="${lista}"]`)]; }

function iniciarArraste(el, idx, y, lista){
  const cards = cardsArrastaveis(lista);
  const rects = cards.map(c => c.getBoundingClientRect());
  arraste = {idx, destino:idx, y0:y, el, cards, lista,
             centros: rects.map(r => r.top + r.height/2),
             altura: rects[idx] ? rects[idx].height + 10 : 0};
  el.classList.add("levantado");
  cards.forEach((c,j)=>{ if(j!==idx) c.classList.add("deslocando"); });
  if(navigator.vibrate) navigator.vibrate(18);
}

function moverArraste(y){
  if(!arraste) return;
  const dy = y - arraste.y0;
  arraste.el.style.transform = `translateY(${dy}px) scale(1.02)`;
  const centroAtual = arraste.centros[arraste.idx] + dy;
  const destino = destinoArraste(arraste.centros, arraste.idx, centroAtual);
  if(destino !== arraste.destino){
    arraste.destino = destino;
    arraste.cards.forEach((c,j)=>{
      if(j===arraste.idx) return;
      let desloc = 0;
      if(j>arraste.idx && j<=destino) desloc = -arraste.altura;
      if(j<arraste.idx && j>=destino) desloc = arraste.altura;
      c.style.transform = desloc ? `translateY(${desloc}px)` : "";
    });
  }
}

function soltarArraste(){
  if(!arraste) return;
  const {idx, destino, lista} = arraste;
  arraste.cards.forEach(c=>{ c.style.transform=""; c.classList.remove("levantado","deslocando"); });
  arraste = null;
  acabouArraste = true;                       // engole o clique que vem logo depois
  setTimeout(()=>{ acabouArraste=false; }, 350);
  if(destino!==idx){
    if(lista==="itens" && editingId){
      syncRoutineName();
      const r = S.routines.find(x=>x.id===editingId);
      if(r){ const [mv]=r.items.splice(idx,1); r.items.splice(destino,0,mv); save(); }
    } else if(lista==="rotinas"){
      const [mv]=S.routines.splice(idx,1); S.routines.splice(destino,0,mv); save();
    }
  }
  render();
}

document.addEventListener("pointerdown", ev => {
  if(arraste) return;
  const el = ev.target.closest && ev.target.closest("[data-arrastar]");
  if(!el) return;
  const lista = el.dataset.lista;
  // exercícios só no editor; treinos só na tela inicial fora de sessão
  if(lista==="itens" && view!=="edit") return;
  if(lista==="rotinas" && !(view==="treinar" && !(S.active && naSessao))) return;
  if(ev.target.closest("input,button,select,textarea")) return;   // campos e botões seguem normais
  const idx = +el.dataset.arrastar;
  pontoInicial = {y: ev.clientY, x: ev.clientX};
  clearTimeout(esperaPressao);
  esperaPressao = setTimeout(() => iniciarArraste(el, idx, pontoInicial.y, lista), 300);
});

document.addEventListener("pointermove", ev => {
  if(esperaPressao && pontoInicial &&
     (Math.abs(ev.clientY-pontoInicial.y)>8 || Math.abs(ev.clientX-pontoInicial.x)>8)){
    clearTimeout(esperaPressao); esperaPressao=null;      // era rolagem, não arraste
  }
  if(arraste) moverArraste(ev.clientY);
});

["pointerup","pointercancel"].forEach(e => document.addEventListener(e, () => {
  clearTimeout(esperaPressao); esperaPressao=null;
  if(arraste) soltarArraste();
}));

// enquanto arrasta, a página não rola junto
document.addEventListener("touchmove", ev => { if(arraste) ev.preventDefault(); }, {passive:false});

window.addEventListener("scroll", () => {
  const t=$("#top"); if(t) t.classList.toggle("scrolled", window.scrollY>4);
});

/* faz o arquivo se comportar como app quando aberto direto no celular */
(function mobileMeta(){
  try{
    document.documentElement.lang = "pt-BR";
    if(document.title==="") document.title = "Treino";
    const add=(n,c,prop)=>{ if(document.querySelector(`meta[${prop||"name"}="${n}"]`)) return;
      const m=document.createElement("meta"); m.setAttribute(prop||"name",n); m.content=c; document.head.appendChild(m); };
    add("viewport","width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1");
    add("theme-color","#F4F6F7");
    add("color-scheme","light dark");
    add("mobile-web-app-capable","yes");
    add("apple-mobile-web-app-capable","yes");
    add("apple-mobile-web-app-status-bar-style","default");
    add("apple-mobile-web-app-title","Treino");

    /* Só na versão publicada (não dentro do Claude): manifesto, ícone e modo offline. */
    const hospedado = /^https?:/.test(location.protocol) && window.self === window.top;
    if(hospedado){
      const link=(rel,href,extra)=>{ if(document.querySelector(`link[rel="${rel}"]`)) return;
        const l=document.createElement("link"); l.rel=rel; l.href=href;
        if(extra) Object.assign(l,extra); document.head.appendChild(l); };
      link("manifest","./manifest.webmanifest");
      link("apple-touch-icon","./icon-192.png");
      link("icon","./icon-512.png");
      if("serviceWorker" in navigator){
        const reg=()=>navigator.serviceWorker.register("./sw.js")
          .then(()=>{ swEstado = navigator.serviceWorker.controller ? "ativo" : "instalando"; render(); })
          .catch(err=>{ swEstado="falhou: "+(err && err.message ? err.message : "erro"); render(); });
        if(document.readyState==="complete") reg(); else window.addEventListener("load",reg);
        navigator.serviceWorker.addEventListener("controllerchange",()=>{ swEstado="ativo"; render(); });
      } else { swEstado="não suportado"; }
    }
  }catch(e){}
})();

/* mantém a tela acesa durante o treino */
let wl=null;
async function wake(on){
  try{
    if(on && !wl && navigator.wakeLock){ wl=await navigator.wakeLock.request("screen"); wl.addEventListener("release",()=>{wl=null;}); }
    else if(!on && wl){ await wl.release(); wl=null; }
  }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && S.active) wake(true); });

load().then(() => {
  const aba = S.meta && S.meta.aba;
  if(["treinar","cardio","historico","progresso"].includes(aba)) view = aba;
  aplicarTema(); render(); if(S.active) wake(true);
});
})();
